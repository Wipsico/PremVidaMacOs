<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Prem Vida - Iniciar Sesión</title>
    <!-- Tailwind CSS & Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #09090b;
            color: #e5e1e4;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(19, 19, 21, 0.6);
            backdrop-filter: blur(40px) saturate(180%);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        .input-recessed {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-recessed:focus {
            border-color: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative">
    <!-- Decorative background elements -->
    <div class="absolute w-[500px] h-[500px] bg-primary-container/10 rounded-full blur-[120px] -top-40 -left-40 animate-pulse"></div>
    <div class="absolute w-[400px] h-[400px] bg-secondary-container/5 rounded-full blur-[100px] -bottom-20 -right-20"></div>

    <!-- Login Container -->
    <div class="w-full max-w-md p-6 relative z-10">
        <div class="glass-card p-10 rounded-3xl space-y-8">
            <!-- Brand Logo & Header -->
            <div class="text-center space-y-3">
                <div class="mx-auto w-14 h-14 bg-primary-container rounded-2xl flex items-center justify-center shadow-lg shadow-primary-container/20">
                    <span class="material-symbols-outlined text-on-primary-container text-3xl font-semibold" style="font-variation-settings: 'FILL' 1;">eco</span>
                </div>
                <div>
                    <h2 class="text-2xl font-bold tracking-tight text-on-surface">Prem Vida Admin</h2>
                    <p class="text-xs text-on-surface-variant uppercase tracking-widest mt-1">E-commerce Suite</p>
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-5">
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Correo Electrónico</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">mail</span>
                        <input id="login-email" required class="w-full input-recessed rounded-xl pl-12 pr-4 py-3 focus:outline-none text-sm text-on-surface" placeholder="ejemplo@premvida.com" type="email"/>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Contraseña</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">lock</span>
                        <input id="login-password" required class="w-full input-recessed rounded-xl pl-12 pr-4 py-3 focus:outline-none text-sm text-on-surface" placeholder="••••••••" type="password"/>
                    </div>
                </div>

                <!-- Bypass Note (Academic / Evaluation) -->
                <div class="bg-white/5 border border-white/5 rounded-xl p-3 text-xs text-on-surface-variant flex items-start gap-2.5">
                    <span class="material-symbols-outlined text-primary text-base mt-0.5">info</span>
                    <div>
                        <p class="font-medium text-on-surface">Acceso de Evaluación Académica</p>
                        <p class="opacity-85 mt-0.5">Use <strong>admin@premvida.com</strong> / <strong>PremVida2026!</strong> para el bypass de evaluación de la facultad.</p>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btn-submit" class="w-full py-3.5 rounded-xl bg-primary text-on-primary font-bold shadow-lg shadow-primary/10 hover:shadow-primary/20 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-lg">login</span>
                    <span>Ingresar al Sistema</span>
                </button>
            </form>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-white/10"></div>
                <span class="flex-shrink mx-4 text-xs text-on-surface-variant uppercase font-medium tracking-wider">O continuar con</span>
                <div class="flex-grow border-t border-white/10"></div>
            </div>

            <!-- Social Authentication (Google OAuth Wired) -->
            <button id="btn-google" class="w-full py-3.5 rounded-xl border border-white/10 hover:bg-white/5 font-semibold text-sm transition-all flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114-3.54 0-6.423-2.883-6.423-6.423 0-3.54 2.883-6.423 6.423-6.423 1.547 0 2.955.553 4.062 1.464l3.116-3.116C19.312 2.222 15.986 1 12.24 1 6.037 1 1 6.037 1 12.24s5.037 11.24 11.24 11.24c5.898 0 10.743-4.254 11.216-9.81H12.24z"/>
                </svg>
                <span>Acceder con Google</span>
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-6 z-[100] px-5 py-4 rounded-xl bg-surface/90 border border-white/15 shadow-2xl backdrop-blur-md flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <span id="toast-icon" class="material-symbols-outlined text-primary">check_circle</span>
        <p id="toast-message" class="text-sm font-medium text-on-surface"></p>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }

        // Initialize Supabase Client if configured
        let supabaseClient = null;
        const supabaseUrl = localStorage.getItem('supabaseUrl');
        const supabaseKey = localStorage.getItem('supabaseKey');
        if (supabaseUrl && supabaseKey && typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        }

        // Form Submit Handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-submit');
            const originalText = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = `<div class="w-5 h-5 border-2 border-on-primary border-t-transparent rounded-full animate-spin"></div><span>Verificando...</span>`;

            // 1. Check bypass credentials
            if (email === 'admin@premvida.com' && password === 'PremVida2026!') {
                showToast('check_circle', 'Acceso de evaluación concedido. Redirigiendo...', 'success');
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', 'admin');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
                return;
            }

            // 2. Real Auth with Supabase if client is initialized
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) throw error;

                    showToast('check_circle', 'Inicio de sesión exitoso.', 'success');
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userRole', 'operator'); // default role from auth if not admin bypass
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } catch (err) {
                    showToast('error', `Error de acceso: ${err.message || err}`, 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } else {
                // If Supabase not set up, show credentials error for anything else
                showToast('error', 'Credenciales incorrectas o Supabase sin configurar.', 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // Google Auth Integration (Wired)
        document.getElementById('btn-google').addEventListener('click', async () => {
            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin + '/dashboard.html'
                        }
                    });
                    if (error) throw error;
                } catch (err) {
                    showToast('error', `Error en Google Auth: ${err.message}`, 'error');
                }
            } else {
                showToast('warning', 'Configura Supabase en Ajustes antes de usar OAuth Google.', 'warning');
            }
        });

        // Toast Helper
        function showToast(icon, message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toast-icon');
            const toastMsg = document.getElementById('toast-message');

            toastIcon.textContent = icon;
            toastMsg.textContent = message;

            toast.className = 'fixed bottom-6 left-6 z-[100] px-5 py-4 rounded-xl bg-surface/90 border border-white/15 shadow-2xl backdrop-blur-md flex items-center gap-3 transform transition-all duration-300 pointer-events-auto opacity-100 translate-y-0';
            
            if (type === 'error') {
                toastIcon.className = 'material-symbols-outlined text-red-500';
                toast.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            } else if (type === 'warning') {
                toastIcon.className = 'material-symbols-outlined text-amber-500';
                toast.style.borderColor = 'rgba(245, 158, 11, 0.4)';
            } else {
                toastIcon.className = 'material-symbols-outlined text-primary';
                toast.style.borderColor = 'rgba(16, 185, 129, 0.4)';
            }

            setTimeout(() => {
                toast.className = 'fixed bottom-6 left-6 z-[100] px-5 py-4 rounded-xl bg-surface/90 border border-white/15 shadow-2xl backdrop-blur-md flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none';
            }, 3000);
        }
    </script>
</body>
</html>
